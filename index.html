<!doctype html>
<html lang="fa-IR" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Task Manager</title>
        <link rel="stylesheet" href="./src/style/output.css" />
    </head>
    <body class="text-text-primary bg-surface-primary">
        <!-- Header -->
        <header
            class="md:hidden grid grid-cols-3 shadow-md rounded-lg p-3 mx-4 mt-4 mb-6"
        >
            <button class="justify-self-start cursor-pointer">
                <img
                    src="./src/assets/icons/hamburgerMenu.svg"
                    alt="burgerButton"
                    class="w-6 h-6 dark:invert"
                />
            </button>
            <div class="justify-self-center">
                <h1 class="text-base font-bold">کوئرا لیست</h1>
            </div>
        </header>
        <!-- Profile Photo -->
        <div class="flex gap-3 mr-4 mb-7 md:mt-16 md:mr-6 md:mb-16 md:hidden">
            <div>
                <img
                    src="./src/assets/icons/profilePhoto.svg"
                    alt="photo"
                    class="w-14 h-14"
                />
            </div>
            <div>
                <div class="text-lg font-extrabold mb-1">سلام، رویا</div>
                <div class="text-sm font-semibold text-text-secondary">
                    امروز، یکشنبه، 21 تیر 1405
                </div>
            </div>
        </div>
        <!-- Line -->
        <hr class="border-[#c8cacd] mx-4 md:hidden" />
        <!-- Dashboard -->
        <div
            id="Responsive"
            class="flex flex-col items-center justify-center m-3 md:flex md:items-center md:justify-center"
        >
            <!-- ====== SECTION 1: PENDING TASKS ====== -->
            <section id="Rem-Tasks" class="w-full max-w-82 md:max-w-186">
                <div id="Today-Task-P" class="flex flex-col gap-1">
                    <p
                        class="font-extrabold text-[16px] mb-2 text-text-primary md:text-[20px]"
                    >
                        تسک‌های امروز
                    </p>
                    <p
                        id="counter"
                        class="font-extrabold text-[12px] text-text-secondary md:text-[14px]"
                    >
                        تسکی برای امروز ندارید!
                    </p>
                </div>

                <!-- Add Task -->
                <div
                    id="task-adder"
                    class="w-full h-[56px] flex flex-row justify-start items-center border-dashed border-2 border-[#cccccc] rounded-[15px] mt-6 cursor-pointer"
                >
                    <button class="w-[24px] h-[24px] text-primary ml-1 mr-5">
                        <img
                            src="./src/images/add.svg"
                            alt="Add New Task"
                            class="cursor-pointer"
                        />
                    </button>
                    <p
                        class="w-[117px] h-[22px] md:w-[131px] font-semibold text-[14px] text-primary md:text-[16px] md:font-bold"
                    >
                        افزودن وظیفه جدید
                    </p>
                </div>
                <!--======================Adding-Task-Box========================-->
                <section>
                    <div
                        class="hidden bg-[#FFFFFF] shadow-md m-auto border-2 rounded-[12px] border-[#E9E9E9] mt-10 w-[328px] text-center md:w-[744px]"
                        id="creatTask"
                    >
                        <input
                            type="text"
                            id="taskName"
                            placeholder="نام تسک"
                            class="placeholder-[#7D7D7F] outline-none pr-2 pt-4 w-[310px] md:w-[725px] font-semibold text-[14px] border-none"
                        />
                        <br />
                        <textarea
                            type="text"
                            id="expression"
                            placeholder="توضیحات"
                            class="placeholder-[#AFAEB2] pr-2 pt-4 outline-none w-[310px] md:w-[725px] text-[12px] border-none resize-none"
                        ></textarea>

                        <br /><br />
                        <button
                            id="tags"
                            class="w-[65px] h-[27px] mr-4 flex gap-2 border-[1px] border-[#E9E9E9] justify-center items-center rounded-[4px] cursor-pointer"
                        >
                            <img
                                src="./src/images/tag-right-1.svg"
                                class="w-4 h-4"
                                alt="img"
                                id="img"
                            />
                            <p class="font-semibold text-[12px] text-[#AFAEB2]">
                                تگ‌ها
                            </p>
                        </button>

                        <div
                            class="flex mr-4 mt-6 w-[213px] bg-white p-2 gap-2 hidden border-[1px] border-[#EBEDEF] rounded-[8px]"
                            id="buttons"
                        >
                            <button
                                id="greenButton"
                                class="bg-[#C3FFF1] p-2 rounded-[4px] text-[#11A483] flex justify-center items-center mb-auto gap-1 px-3 py-1 cursor-pointer"
                            >
                                <img
                                    src="./src/images/Mark.svg"
                                    id="greenClose"
                                    class="hidden w-4 h-4"
                                />
                                <p class="text-[12px] font-bold">پایین</p>
                            </button>

                            <div
                                class="w-px mx-1 bg-[#EBEDEF]"
                                id="line1"
                            ></div>

                            <button
                                id="yellowButton"
                                class="bg-[#FFEFD6] p-2 rounded-[4px] text-[#FFAF37] flex justify-center items-center mb-auto gap-1 px-3 py-1 cursor-pointer"
                            >
                                <img
                                    src="./src/images/Mark.svg"
                                    id="yellowClose"
                                    class="hidden w-4 h-4"
                                />
                                <p class="text-[12px] font-bold">متوسط</p>
                            </button>

                            <div
                                class="w-px mx-1 bg-[#EBEDEF]"
                                id="line2"
                            ></div>

                            <button
                                id="redButton"
                                class="bg-[#FFE2DB] p-2 rounded-[4px] text-[#FF5F37] flex justify-center items-center mb-auto gap-1 px-3 py-1 cursor-pointer"
                            >
                                <img
                                    src="./src/images/Mark.svg"
                                    id="redClose"
                                    class="hidden w-4 h-4"
                                />
                                <p class="text-[12px] font-bold">بالا</p>
                            </button>
                        </div>
                        <br />

                        <hr class="border-[#E9E9E9]" />

                        <div class="flex gap-4 m-4 justify-end">
                            <button
                                id="deleteAdd"
                                class="w-8 h-8 bg-[#F5F5F5] hover:bg-gray-300 rounded-md cursor-pointer"
                            >
                                <img
                                    src="./src/images/delete.svg"
                                    alt="img"
                                    class="h-[10px] w-[10px] flex justify-center items-center m-auto"
                                />
                            </button>

                            <button
                                id="submit"
                                disabled
                                class="w-[121px] h-[31px] text-[12px] font-semibold rounded-md text-white hover:enabled:bg-blue-700 bg-blue-300 cursor-pointer"
                            >
                                اضافه کردن تسک
                            </button>
                        </div>
                    </div>
                </section>

                <div
                    id="readTask"
                    class="flex flex-col gap-2 m-4 w-[328px] md:w-[744px] m-auto"
                ></div>

                <section
                    id="No-Task"
                    class="flex flex-col justify-center items-center w-full max-w-[328px] md:max-w-[744px] mt-8"
                >
                    <img
                        class="w-[201px] h-[172px] opacity-50 mt-[25px] md:w-[283px] md:h-[232px]"
                        src="./src/images/No Task.svg"
                        alt="No-Task"
                    />
                    <div
                        class="w-full max-w-[273px] h-[71px] mt-[15px] flex flex-col justify-center items-center"
                    >
                        <h1
                            class="font-extrabold text-[16px] text-text-primary"
                        >
                            چه کارهایی امروز برای انجام داری؟
                        </h1>
                        <p
                            class="w-full max-w-[273px] h-[44px] font-semibold text-[14px] text-text-secondary opacity-70 mt-[10px] text-center"
                        >
                            میتونی الان تسک‌هاتو اینجا بنویسی و برنامه ریزی رو
                            شروع کنی!
                        </p>
                    </div>
                </section>
            </section>
            <!-- ====== SECTION 2: COMPLETED TASKS ====== -->
            <section
                id="Completed-Items"
                class="w-full max-w-[328px] md:max-w-[744px] mt-8"
            >
                <div id="Today-Task-P" class="flex flex-col gap-1">
                    <p
                        class="font-extrabold text-[16px] mb-2 text-text-primary md:text-[20px]"
                    >
                        تسک‌های انجام شده
                    </p>
                    <p
                        id="checkedCount"
                        class="font-extrabold text-[12px] text-text-secondary md:text-[14px]"
                    ></p>
                </div>
                <div
                    id="doneTasks"
                    class="flex flex-col gap-2 m-4 w-[328px] md:w-[744px] min-h-[66px]"
                ></div>
            </section>
        </div>
        <script
            type="module"
            src="./src/scripts/modules/createTasks.js"
        ></script>
    </body>
</html>
